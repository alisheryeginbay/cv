name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - run: make
      - uses: actions/upload-artifact@v5
        with:
          name: example-cv
          path: example.pdf

  # On a release tag, pin cv-content to it. The push is made with a PAT so it triggers cv-content's publish.
  bump-content:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: alisheryeginbay/cv-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
      - name: Bump TEMPLATE_REF
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sed -i -E "s/^(TEMPLATE_REF[[:space:]]*\?=[[:space:]]*).*/\1${TAG}/" Makefile
          if git diff --quiet; then echo "already at $TAG"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: bump template to $TAG"
          git push
